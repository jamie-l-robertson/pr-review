name: self-test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install the SDK
        # anthropic, not just pydantic: call_claude imports beta_tool to build
        # the tool schemas even when a fake client is injected, so the wrap-up
        # test cannot run without it.
        run: pip install --quiet "anthropic==1.5.0"
      - run: python review/test_checks.py
      - name: Wrap-up path (fake client, no API calls)
        run: python review/test_wrapup.py
      - name: Compile all scripts
        run: python -m compileall -q review
